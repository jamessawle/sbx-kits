schemaVersion: "2"
kind: mixin
name: internal-sbx-validator
displayName: Internal Docker Sandbox kit validator
description: Installs the sbx CLI used to validate this repository's kits

caps:
  network:
    allow:
      - github.com
      - objects.githubusercontent.com

commands:
  install:
    - command: |
        set -euo pipefail

        version=0.37.0
        case "$(uname -m)" in
          x86_64)
            architecture=amd64
            checksum=770abf7f91b13aba86cc7bb7d548b8e07c812d5a109321905e7b7da0ad07d998
            ;;
          aarch64 | arm64)
            architecture=arm64
            checksum=b55eb978e3b5661ddca67182fb5c33d3ceacffbc259c4c3c6141a545c9b2bcec
            ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        archive=$(mktemp)
        extract_dir=$(mktemp -d)
        cleanup() {
          rm -f "$archive"
          rm -rf "$extract_dir"
        }
        trap cleanup EXIT

        url="https://github.com/docker/sbx-releases/releases/download/v${version}/DockerSandboxes-linux-${architecture}.tar.gz"
        curl --fail --location --silent --show-error "$url" --output "$archive"
        printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --status
        tar -xzf "$archive" -C "$extract_dir"
        install -m 0755 "$extract_dir/docker-sbx/sbx" /usr/local/bin/sbx
        sbx version
      description: Install the pinned sbx CLI for local kit validation
