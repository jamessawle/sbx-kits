name: Feature request
description: Propose a new kit, capability, or user-facing improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New kit
        - Existing kit
        - Repository tooling or automation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the user need this proposal would address.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the desired behavior, including an example where useful.
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security and network impact
      description: Identify any new capabilities, network hosts, credentials, mounts, or trust assumptions.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing kits or approaches that you considered.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues for similar proposals.
          required: true
