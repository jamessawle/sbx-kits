name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # No license allow/deny list: this check currently enforces vulnerability risk only.
          comment-summary-in-pr: on-failure

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Docker Sandbox CLI
        env:
          SBX_CHECKSUM: 2ec45bc7938c20c2f406fe8cc72294ad5a954bdc047601484b89bf1a108311d4
          SBX_VERSION: 0.39.0
        run: |
          archive=$(mktemp)
          extract_dir=$(mktemp -d)
          curl --fail --location --silent --show-error \
            "https://github.com/docker/sbx-releases/releases/download/v${SBX_VERSION}/DockerSandboxes-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$SBX_CHECKSUM" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$extract_dir"
          sudo install -m 0755 "$extract_dir/docker-sbx/sbx" /usr/local/bin/sbx
          sbx version

      - name: Validate repository
        run: mise validate
