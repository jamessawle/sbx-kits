name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Docker Sandbox CLI
        env:
          SBX_CHECKSUM: 146daaebd948f2bbb8e46c31c139b79531c9a780f94f915a0fc4cac2ebcfb05b
          SBX_VERSION: 0.35.0
        run: |
          archive=$(mktemp)
          extract_dir=$(mktemp -d)
          curl --fail --location --silent --show-error \
            "https://github.com/docker/sbx-releases/releases/download/v${SBX_VERSION}/DockerSandboxes-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$SBX_CHECKSUM" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$extract_dir"
          sudo install -m 0755 "$extract_dir/docker-sbx/sbx" /usr/local/bin/sbx
          sbx version

      - name: Validate repository
        run: mise validate
