name: Update kit dependencies

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-kit-dependencies
  cancel-in-progress: false

jobs:
  update:
    name: Update kit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.SBX_KITS_AUTOMATION_TOKEN || github.token }}
      UPDATE_BRANCH: automation/weekly-kit-dependencies

    steps:
      - name: Check out repository
        # Credentials are required by the later authenticated branch push.
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SBX_KITS_AUTOMATION_TOKEN || github.token }}

      - name: Update kit dependencies
        run: node .github/scripts/update-kit-dependencies.mjs

      - name: Create pull request
        run: |
          if git diff --quiet -- kits/; then
            echo "Kit dependencies are already current."
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --create "$UPDATE_BRANCH"
          git add kits/
          git commit --message "chore(kits): update weekly dependencies"
          git fetch origin \
            "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git push --force-with-lease origin "$UPDATE_BRANCH"

          pull_request=$(
            gh pr list \
              --head "$UPDATE_BRANCH" \
              --base main \
              --state open \
              --json url \
              --jq '.[0].url'
          )

          if [[ -z "$pull_request" ]]; then
            pull_request=$(
              gh pr create \
                --base main \
                --head "$UPDATE_BRANCH" \
                --title "chore(kits): update weekly dependencies" \
                --body "Updates dependencies pinned within the kits."
            )
          fi

          gh pr merge --auto --merge "$pull_request"
