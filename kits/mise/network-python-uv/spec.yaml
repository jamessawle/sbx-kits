schemaVersion: "2"
kind: mixin
name: mise-network-python-uv
displayName: Mise Python and uv network access
description: Permits Python toolchain and locked package downloads

caps:
  network:
    allow:
      # Tool version resolution beyond the GitHub hosts supplied by the
      # community Mise kit.
      - mise-versions.jdx.dev

      # Locked Python package metadata and artifacts.
      - pypi.org
      - files.pythonhosted.org

      # Pyright can provision Node through nodeenv when the agent image does not
      # already provide a compatible runtime.
      - nodejs.org
