min_version = "2026.5.2"

[tools]
actionlint = "1.7.12"
lychee = "0.24.2"
node = "24.4.1"
shellcheck = "0.11.0"
shfmt = "3.13.1"
tombi = "1.2.4"
zizmor = "1.29.0"

[tasks.setup]
description = "Install repository tools and dependencies"
run = [
  "mise install",
  "npm ci",
  "git config core.hooksPath .githooks",
]

[tasks.validate]
description = "Run all checks, including Docker Sandbox kit validation"
depends = ["fmt:check", "lint", "test", "validate:metadata"]
run = "./.docker-sbx/sandbox.sh validate"

[tasks.test]
description = "Run repository tests with enforced JavaScript coverage"
run = "npm test"

[tasks."validate:metadata"]
description = "Validate kit metadata and documentation consistency"
run = "npm run validate:metadata"

[tasks."fmt:check"]
description = "Check source formatting"
run = [
  'npm exec -- prettier --check "**/*.{json,jsonc,md,mjs,yaml}"',
  "tombi format --offline --check mise.toml",
  "shfmt -d .docker-sbx/sandbox.sh .githooks .mise/tasks",
]

[tasks.fmt]
description = "Format authored source files"
run = [
  'npm exec -- prettier --write "**/*.{json,jsonc,md,mjs,yaml}"',
  "tombi format --offline mise.toml",
  "shfmt -w .docker-sbx/sandbox.sh .githooks .mise/tasks",
]

[tasks.lint]
description = "Run static analysis"
depends = ["lint:links"]
run = [
  "actionlint .github/workflows/*.yml",
  "zizmor .github/workflows",
  "npm exec -- markdownlint-cli2",
  "tombi lint --offline --error-on-warnings mise.toml",
  "shellcheck .docker-sbx/sandbox.sh .githooks/* .mise/tasks/sandbox .mise/tasks/hooks/*",
]

[tasks."lint:links"]
description = "Check local Markdown links and heading anchors"
run = """lychee --offline --include-fragments --index-files README.md --no-progress --exclude-path node_modules --exclude-path .git --exclude-path lychee './**/*.md'"""
